plugins {
	id 'fabric-loom' version '1.9-SNAPSHOT'
	id 'maven-publish'
}

version = "1.0.0"
group = "com.example"

base {
	archivesName = "combat-roll-bypass"
}

repositories {
	maven { url "https://modrinth.com" }
}

dependencies {
	minecraft "com.mojang:minecraft:26.3"
	mappings "net.fabricmc:yarn:26.3+build.1:v2"
	modImplementation "net.fabricmc:fabric-loader:0.16.0"
	
	// Зависимости под версию 26.3
	modImplementation "maven.modrinth:combat-roll:3.0.1+26.3-fabric"
	modImplementation "maven.modrinth:azurelib:3.0.0+26.3-fabric"
}

processResources {
	inputs.property "version", project.version
	filteringCharset = 'UTF-8'

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}
